name: Linux release matrix

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/linux-release-matrix.yml"
      - "CMakeLists.txt"
      - "CMakePresets.json"
      - "Makefile"
      - "cmake/**"
      - "docs/**"
      - "examples/**"
      - "include/**"
      - "lua/**"
      - "scripts/**"
      - "src/**"
      - "tests/**"
      - "vendor/kore/patches/**"
      - "TODO.md"
  push:
    branches:
      - trunk
      - main
      - init
    paths:
      - ".github/workflows/linux-release-matrix.yml"
      - "CMakeLists.txt"
      - "CMakePresets.json"
      - "Makefile"
      - "cmake/**"
      - "docs/**"
      - "examples/**"
      - "include/**"
      - "lua/**"
      - "scripts/**"
      - "src/**"
      - "tests/**"
      - "vendor/kore/patches/**"
      - "TODO.md"

permissions:
  contents: read

concurrency:
  group: linux-release-matrix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-matrix:
    name: GNU and musl release matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    env:
      VECTIS_REQUIRE_LINUX_RELEASE_MATRIX: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install host prerequisites
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ca-certificates \
            cmake \
            curl \
            file \
            git \
            lua5.4 \
            luarocks \
            make \
            ninja-build \
            pkg-config \
            unzip \
            zip

      - name: Cache pkt.systems archives and toolchains
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/c.pkt.systems/deps
            ~/.cache/c.pkt.systems/toolchains
          key: ${{ runner.os }}-cpkt-release-${{ hashFiles('scripts/cpkt-toolchains.sh', 'scripts/cpkt-aflpp.sh', 'scripts/deps.sh', 'cmake/toolchains/*.cmake', 'CMakePresets.json') }}
          restore-keys: |
            ${{ runner.os }}-cpkt-release-

      - name: Run release matrix
        shell: bash
        run: |
          set -euo pipefail
          make release-matrix

      - name: Upload release matrix artifacts
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: vectis-linux-release-matrix
          path: dist/
          if-no-files-found: error
