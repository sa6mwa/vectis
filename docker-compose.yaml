name: vectis-e2e

services:
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: lockddev
      MINIO_ROOT_PASSWORD: lockddevpass
    ports:
      - "${VECTIS_MINIO_API_PORT:-29000}:9000"
      - "${VECTIS_MINIO_CONSOLE_PORT:-29001}:9001"
    volumes:
      - ./devenv/volumes/minio-data:/data

  # One-shot bootstrap job. It is expected to exit 0 after creating the bucket.
  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint:
      - /bin/sh
      - -ec
      - |
        until mc alias set local http://minio:9000 lockddev lockddevpass; do
          sleep 1
        done
        mc alias set local http://minio:9000 lockddev lockddevpass
        mc mb --ignore-existing local/lockd-client-s3
        mc anonymous set none local/lockd-client-s3
    restart: "no"

  # One-shot bootstrap job. It is expected to exit 0 after creating the shared
  # lockd CA bundle used by every lockd service in this compose environment.
  lockd-ca:
    image: docker.io/pktsystems/lockd:v0.9.0
    command: ["auth", "new", "ca", "--cn", "vectis-lockd-root", "--out", "/config/ca.pem", "--force"]
    restart: on-failure
    volumes:
      - ./devenv/volumes/lockd-config:/config

  # One-shot bootstrap job. It creates the disk server bundle from the shared CA.
  lockd-disk-server-cert:
    image: docker.io/pktsystems/lockd:v0.9.0
    depends_on:
      - lockd-ca
    command: ["auth", "new", "server", "--ca-in", "/config/ca.pem", "--cn", "vectis-lockd-disk", "--hosts", "lockd-disk,localhost,127.0.0.1", "--out", "/config/disk-server.pem", "--force"]
    restart: on-failure
    volumes:
      - ./devenv/volumes/lockd-config:/config

  # One-shot bootstrap job. It creates the S3 server bundle from the shared CA.
  lockd-s3-server-cert:
    image: docker.io/pktsystems/lockd:v0.9.0
    depends_on:
      - lockd-ca
    command: ["auth", "new", "server", "--ca-in", "/config/ca.pem", "--cn", "vectis-lockd-s3", "--hosts", "lockd-s3,localhost,127.0.0.1", "--out", "/config/s3-server.pem", "--force"]
    restart: on-failure
    volumes:
      - ./devenv/volumes/lockd-config:/config

  # One-shot bootstrap job. This client bundle is trusted by all lockd services.
  lockd-client-cert:
    image: docker.io/pktsystems/lockd:v0.9.0
    depends_on:
      - lockd-ca
    command: ["auth", "new", "client", "--ca-in", "/config/ca.pem", "--cn", "vectis-lockd-client", "-n", "default=rw", "--out", "/config/client.pem", "--force"]
    restart: on-failure
    volumes:
      - ./devenv/volumes/lockd-config:/config

  lockd-disk:
    image: docker.io/pktsystems/lockd:v0.9.0
    depends_on:
      - lockd-disk-server-cert
      - lockd-client-cert
    restart: unless-stopped
    command: ["--bundle", "/config/disk-server.pem", "--connguard-enabled=false", "--store", "disk:///storage", "--listen", ":9341", "--listen-proto", "tcp"]
    environment:
      LOCKD_CONFIG_DIR: /config
      LOCKD_OTLP_ENDPOINT: ""
    ports:
      - "${VECTIS_LOCKD_DISK_PORT:-29441}:9341"
    volumes:
      - ./devenv/volumes/lockd-config:/config
      - ./devenv/volumes/lockd-disk-storage:/storage

  lockd-s3:
    image: docker.io/pktsystems/lockd:v0.9.0
    depends_on:
      - minio
      - minio-init
      - lockd-s3-server-cert
      - lockd-client-cert
    restart: unless-stopped
    command: ["--bundle", "/config/s3-server.pem", "--connguard-enabled=false", "--store", "s3://minio:9000/lockd-client-s3/vectis?insecure=1&path-style=1", "--listen", ":9341", "--listen-proto", "tcp"]
    environment:
      LOCKD_CONFIG_DIR: /config
      LOCKD_OTLP_ENDPOINT: ""
      LOCKD_S3_ACCESS_KEY_ID: lockddev
      LOCKD_S3_SECRET_ACCESS_KEY: lockddevpass
    ports:
      - "${VECTIS_LOCKD_S3_PORT:-29443}:9341"
    volumes:
      - ./devenv/volumes/lockd-config:/config

  ssh-sftp:
    image: lscr.io/linuxserver/openssh-server:latest
    restart: unless-stopped
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: UTC
      USER_NAME: vectis
      USER_PASSWORD: vectispass
      PASSWORD_ACCESS: "true"
      SUDO_ACCESS: "false"
      LOG_STDOUT: "true"
    ports:
      - "${VECTIS_SSH_PORT:-29222}:2222"
    volumes:
      - ./devenv/volumes/ssh-sftp-config:/config
      - ./devenv/volumes/ssh-sftp-data:/data

  mqtt:
    image: emqx/nanomq:0.24.13
    restart: unless-stopped
    ports:
      - "${VECTIS_MQTT_PORT:-21883}:1883"
